networks:
  erp-network:
    driver: bridge

volumes:
  kafka-data:
  face-models:

services:

  # ── MySQL ─────────────────────────────────────────────────────────────────
  # Not containerized — services connect to the locally installed MySQL on
  # the host machine via Docker Desktop's host.docker.internal DNS name.
  # Make sure your local MySQL:
  #   - listens on 0.0.0.0 (bind-address), not just 127.0.0.1
  #   - has a root user that accepts TCP connections from a remote host
  #     (root@'%' or an equivalent grant), since host.docker.internal
  #     arrives as a non-localhost connection

  # ── Kafka (KRaft mode — no Zookeeper) ────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: erp-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://erp-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@erp-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - erp-network

  # ── Kafka UI (monitoring) ─────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: erp-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8888:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: erp-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: erp-kafka:9092
    networks:
      - erp-network

  # ── Eureka Discovery Server ───────────────────────────────────────────────
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: erp-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider",
             "http://eureka:eureka-secret@localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

  # ── API Gateway ───────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: erp-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@erp-eureka:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 320m

  # ── Main ERP Service ──────────────────────────────────────────────────────
  college-erp-service:
    build:
      context: .
      dockerfile: college-erp-service/Dockerfile
    container_name: erp-main
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/erp_main?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: erp-kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@erp-eureka:8761/eureka/
      FACE_MODEL_PATH: /app/face-models
    volumes:
      - face-models:/app/face-models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 1024m

  # ── Notification Service ──────────────────────────────────────────────────
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: erp-notification
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/erp_notifications?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: erp-kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:eureka-secret@erp-eureka:8761/eureka/
      MAIL_USERNAME: ${MAIL_USERNAME:-your-email@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your-app-password}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - erp-network
    deploy:
      resources:
        limits:
          memory: 384m
