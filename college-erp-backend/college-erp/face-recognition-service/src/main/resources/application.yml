server:
  port: 8090
  # Increase max file size for photo uploads
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

spring:
  application:
    name: face-recognition-service
  datasource:
    url: jdbc:mysql://localhost:3306/erp_face?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka-secret@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /api-docs

# AI / Face Recognition config
face:
  model:
    path: ./face-models          # Persisted LBPH model XMLs
  confidence:
    threshold: 80.0              # Lower = stricter match (LBPH distance)
  haar:
    cascade:
      path: haarcascade_frontalface_default.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info
